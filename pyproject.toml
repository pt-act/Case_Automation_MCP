[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cam"]

[project]
name = "case-automation-mcp"
version = "0.1.0"
description = "Immigration firm case automation MCP server"
requires-python = ">=3.12"
dependencies = [
    # MCP
    "mcp[cli]>=1.28.1",
    "fastmcp>=2.0",
    # HTTP / sidecar
    "fastapi>=0.115",
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    "uvicorn[standard]>=0.30",
    # Models / validation
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.14.2",
    # DB / migrations
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    # Queue / scheduling
    "celery[redis]>=5.4",
    "redis>=5.0",
    # HTTP client / retries
    "httpx>=0.27",
    "tenacity>=8.3",
    "typer>=0.12",
    # Encryption
    "cryptography>=50.0.0",
    # Observability
    "structlog>=24.1",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "prometheus-client>=0.20",
    # Document generation (used in later specs)
    "docxtpl>=0.18",
    "Jinja2>=3.1",
    # Data extraction (used in later specs)
    "pdfplumber>=0.11",
    "PyMuPDF>=1.24",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "sqlalchemy[mypy]>=2.0",
    "types-redis>=4.6",
    "types-Jinja2>=2.11",
    # Security scanning (CI)
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/cam"]
omit = ["*/migrations/*", "*/sidecar/celery*", "*/sidecar/main.py"]

[tool.coverage.report]
# Sprint 3 floor: 75 %.  Ratchet to 80 % after Celery integration tests land.
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
