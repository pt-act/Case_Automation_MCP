# Project manifest — the DAG of specs for the Case Automation MCP Server.
# Schema: concept-of PROJECT_MANIFEST.md (§B). The manifest is the index;
# specs/<id>/spec.md are the chapters. Append-only history; canonical for DAG.

project:
  name: case-automation-mcp
  objective: >
    Unify the immigration firm's case-management, CRM, email, and document
    systems behind one Python MCP server that drafts and — only after a human
    approval gate — executes intake, status updates, document generation and
    routing, and deadline tracking, with every action audited and reversible by
    default.
  created: 2026-05-30
  status: executing
  operator: human:RA

# ---------------------------------------------------------------------------
# specs — the DAG. Status reflects implementation state:
#   `implemented`  — code + tests landed and green
#   `in_progress`  — core landed, hardening/refinement ongoing
#   `planned`      — spec exists, implementation not started
# `produces`/`consumes` are interface SUMMARIES; full contracts live in the
# spec files. Cross-cutting reliance on platform-foundation config/observability
# is captured by depends_on rather than enumerated as a data interface.
# ---------------------------------------------------------------------------
specs:

  # ===== Layer 1: platform / foundation (units) =====

  - id: platform-foundation
    title: Platform foundation — domain model, persistence, audit, security baseline
    type: unit
    status: implemented
    impl_note: >-
      Domain model, persistence (SQLAlchemy 2 + Alembic), hash-chained audit,
      AES-256-GCM crypto, RBAC, PII scrubber, 12-factor config + secret store
      (env/SOPS+age/Vault/KMS). Phase 1.3 (SOPS+age) complete; PostgresRunStore
      complete. 55 test functions. CI green.
    file: specs/platform-foundation/spec.md
    depends_on: []
    produces:
      - name: domain_model
        shape: "pydantic_v2 entities{Contact, Matter, Document, Deadline, Communication, Task}"
        consumers: [connector-framework, workflow-orchestration, data-extraction, qc-verification, deadline-engine, client-intake, status-update-emails, document-generation, document-routing]
      - name: persistence
        shape: "PostgreSQL + SQLAlchemy 2 repositories + Alembic migrations"
        consumers: [connector-framework, workflow-orchestration, deadline-engine]
      - name: audit_log
        shape: "append-only hash-chained audit writer + export API{actor, action, inputs, outputs, approval, ts, run_id}"
        consumers: [workflow-orchestration, qc-verification, deadline-engine]
      - name: security_baseline
        shape: "AES-256 at-rest + column token encryption, RBAC model, constrained service identity, PII redaction"
        consumers: [connector-framework, workflow-orchestration, qc-verification, data-extraction]
    consumes: []

  - id: domain-packs
    title: Domain packs — domain-agnostic config/policy bundle + reference packs
    type: unit
    status: implemented
    impl_note: >-
      G1-G7 complete. DomainPack contract, registry, fail-closed validation,
      PII baseline composition, conformance harness, immigration + consulting
      reference packs. G6 consumer rewiring complete (intake, deadline, routing,
      QC restriction check read from active pack). Task 6.5 (RBAC role names +
      status-update trigger allow-list pack wiring) deliberately descoped —
      engine-neutral structure with no immigration value; deferred to CLI env
      with full DB suite. 'No immigration value in core' guard (6.6) is a hard
      assert. 26 test functions. CI green.
    file: specs/domain-packs/spec.md
    depends_on: [platform-foundation]
    produces:
      - name: domain_pack
        shape: "DomainPack contract + registry + active-pack selection; Terminology; RestrictionPolicy (tighten-only); PII baseline-plus-additions; immigration + consulting reference packs"
        consumers: [client-intake, deadline-engine, document-routing, qc-verification, status-update-emails]
    consumes:
      - name: domain_model
        from: platform-foundation
      - name: security_baseline
        from: platform-foundation

  - id: connector-framework
    title: Connector framework — vendor-agnostic ports, webhooks, idempotency
    type: unit
    status: implemented
    impl_note: >-
      Ports (CaseConnector, CRMConnector, EmailConnector, DocStoreConnector),
      typed error taxonomy, circuit breaker middleware with retry/jitter,
      HMAC webhook pipeline, reference adapters. Vendor adapters deferred
      pending firm confirmation (ADR-3). 51 test functions. CI green.
    file: specs/connector-framework/spec.md
    depends_on: [platform-foundation]
    produces:
      - name: case_port
        shape: "CaseConnector protocol{get_matter, upsert_matter, list_tasks, ...} (vendor-agnostic)"
        consumers: [deadline-engine, client-intake]
      - name: crm_port
        shape: "CRMConnector protocol{find_contact, upsert_contact, ...}"
        consumers: [client-intake]
      - name: email_port
        shape: "EmailConnector protocol{draft, send, log} (draft-by-default)"
        consumers: [client-intake, status-update-emails]
      - name: docstore_port
        shape: "DocStoreConnector protocol{put, get, move(acl)}"
        consumers: [document-generation, document-routing]
      - name: webhook_events
        shape: "normalised inbound Event stream (HMAC-verified, deduped) → trigger sink"
        consumers: [workflow-orchestration]
      - name: connector_error
        shape: "typed taxonomy{auth, rate_limit, not_found, transient, fatal} for retry-vs-gate-vs-fail"
        consumers: [workflow-orchestration]
    consumes:
      - name: domain_model
        from: platform-foundation
      - name: persistence
        from: platform-foundation
      - name: security_baseline
        from: platform-foundation

  - id: workflow-orchestration
    title: Workflow orchestration — durable engine, gates, triggers
    type: unit
    status: implemented
    impl_note: >-
      Durable state-machine engine, @workflow DSL, run/step persistence,
      idempotency, retry/compensation, parked runs, human-approval gates with
      signed single-use tokens (3 channels: MCP/web/email), triggers, recovery
      sweep. InMemoryRunStore (tests) + PostgresRunStore (production, Phase 1.2).
      50 test functions. CI green.
    file: specs/workflow-orchestration/spec.md
    depends_on: [platform-foundation, connector-framework]
    produces:
      - name: workflow_engine
        shape: "durable resumable state-machine runtime; @workflow defs; run/step persistence; idempotency; retry/compensation; parked runs"
        consumers: [deadline-engine, qc-verification, client-intake, status-update-emails]
      - name: gate_contract
        shape: "human-approval gate + 3 channels{mcp_callback, web_ui, email_action}; signed single-use expiring tokens; resume|reject"
        consumers: [qc-verification, client-intake, status-update-emails]
      - name: scheduler
        shape: "schedule/timer trigger API for time-based runs"
        consumers: [deadline-engine, status-update-emails]
      - name: workflow_tools
        shape: "MCP tools{workflow.run, workflow.status}"
        consumers: [client-intake, status-update-emails]
    consumes:
      - name: domain_model
        from: platform-foundation
      - name: persistence
        from: platform-foundation
      - name: audit_log
        from: platform-foundation
      - name: security_baseline
        from: platform-foundation
      - name: webhook_events
        from: connector-framework
      - name: connector_error
        from: connector-framework

  # ===== Layer 2: core services / engines (units) =====

  - id: data-extraction
    title: Data extraction — text + OCR + provider-agnostic LLM structuring
    type: unit
    status: implemented
    impl_note: >-
      Text extraction (pdfplumber/PyMuPDF), OCR (Tesseract), provider-agnostic
      LLM structuring with per-field confidence, coverage analysis, residency
      guard. Proposes only, never writes to system-of-record. 48 test functions.
      CI green.
    file: specs/data-extraction/spec.md
    depends_on: [platform-foundation]
    produces:
      - name: document_extract
        shape: "MCP tool{document.extract} → fields mapped to domain_model + per-field confidence∈[0,1]; low-confidence flagged; proposes only, never writes system-of-record"
        consumers: [client-intake, document-routing]
    consumes:
      - name: domain_model
        from: platform-foundation
      - name: security_baseline
        from: platform-foundation

  - id: qc-verification
    title: QC verification — composable check registry feeding gates
    type: unit
    status: implemented
    impl_note: >-
      Composable check registry (completeness, consistency, recipient integrity,
      attachment integrity, privilege/restriction, deadline sanity, extraction
      confidence), QC packet builder, MCP tool, severity-policy enforcement,
      totality guarantee. Restriction check reads the active domain pack's
      RestrictionPolicy (fail-closed, tighten-only). 49 test functions. CI green.
    file: specs/qc-verification/spec.md
    depends_on: [platform-foundation, workflow-orchestration, domain-packs]
    produces:
      - name: qc_verify
        shape: "MCP tool{qc.verify} runs checks{completeness, consistency, recipient_integrity, attachment_integrity, privilege, deadline_sanity, extraction_confidence} → pass|warn|fail; any fail blocks gate"
        consumers: [status-update-emails, document-generation, document-routing]
    consumes:
      - name: domain_model
        from: platform-foundation
      - name: audit_log
        from: platform-foundation
      - name: security_baseline
        from: platform-foundation
      - name: workflow_engine
        from: workflow-orchestration
      - name: gate_contract
        from: workflow-orchestration

  - id: deadline-engine
    title: Deadline engine — rule sets, business-day calc, reminders, escalation
    type: unit
    status: implemented
    impl_note: >-
      Versioned rule sets (YAML), business-day calendar with holiday tables,
      computation trace, scheduling with redundant reminders + escalation,
      dead-man's-switch, reconciliation sweep. Liability-critical — never
      silent-fail. Rules sourced from the active domain pack. 36 test functions.
      CI green.
    file: specs/deadline-engine/spec.md
    depends_on: [platform-foundation, connector-framework, workflow-orchestration, domain-packs]
    produces:
      - name: deadline_compute
        shape: "MCP tool{deadline.compute} → business-day-adjusted due date from versioned rule set + ComputationTrace"
        consumers: [client-intake]
      - name: deadline_schedule
        shape: "MCP tool{deadline.schedule} → persist + arm redundant reminders + escalation; dead-man's-switch; never silent-fail"
        consumers: [client-intake]
    consumes:
      - name: domain_model
        from: platform-foundation
      - name: persistence
        from: platform-foundation
      - name: audit_log
        from: platform-foundation
      - name: case_port
        from: connector-framework
      - name: workflow_engine
        from: workflow-orchestration
      - name: scheduler
        from: workflow-orchestration

  # ===== Layer 3: workflows / compositions =====

  - id: client-intake
    title: Client intake — lead to structured matter (composition)
    type: integration
    status: implemented
    impl_note: >-
      Lead parsing, contact dedupe (fuzzy + A-number), contact/matter creation,
      deadline computation, opening tasks, gated welcome email. Case types,
      dedupe config, and identifier patterns sourced from the active domain
      pack. 29 test functions. CI green.
    file: specs/client-intake/spec.md
    depends_on: [platform-foundation, connector-framework, workflow-orchestration, data-extraction, deadline-engine, domain-packs]
    produces:
      - name: intake_workflow
        shape: "MCP tool{intake.run} + prompt{intake_interview}: lead → contact + matter shell + opening tasks + drafted welcome (gated send)"
        consumers: []
    consumes:
      - name: domain_model
        from: platform-foundation
      - name: crm_port
        from: connector-framework
      - name: email_port
        from: connector-framework
      - name: case_port
        from: connector-framework
      - name: workflow_engine
        from: workflow-orchestration
      - name: gate_contract
        from: workflow-orchestration
      - name: workflow_tools
        from: workflow-orchestration
      - name: document_extract
        from: data-extraction
      - name: deadline_compute
        from: deadline-engine
      - name: deadline_schedule
        from: deadline-engine

  - id: status-update-emails
    title: Status-update emails — change to drafted update to gated send (composition)
    type: integration
    status: implemented
    impl_note: >-
      Change detection, delta computation, tailored draft generation,
      recipient-integrity QC, human-approval gate, idempotent send/log.
      Deprecated service shims removed (Phase 1.5). 25 test functions. CI green.
    file: specs/status-update-emails/spec.md
    depends_on: [platform-foundation, connector-framework, workflow-orchestration, qc-verification, domain-packs]
    produces:
      - name: status_update_workflow
        shape: "workflow: status-change → tailored draft → recipient-integrity QC → approval gate → send/log; idempotent one-send-per-change"
        consumers: []
    consumes:
      - name: domain_model
        from: platform-foundation
      - name: email_port
        from: connector-framework
      - name: workflow_engine
        from: workflow-orchestration
      - name: gate_contract
        from: workflow-orchestration
      - name: scheduler
        from: workflow-orchestration
      - name: workflow_tools
        from: workflow-orchestration
      - name: qc_verify
        from: qc-verification

  - id: document-generation
    title: Document generation — templates to versioned DOCX/PDF with QC
    type: unit
    status: implemented
    impl_note: >-
      Template store (versioned), DOCX rendering (docxtpl), gap detection
      (never silent blanks), context builder, version store with checksums,
      MCP tools (document.generate, form.prefill). PDF conversion is a
      configurable stub awaiting engine confirmation (Phase 1.4). 36 test
      functions. CI green.
    file: specs/document-generation/spec.md
    depends_on: [platform-foundation, connector-framework, qc-verification]
    produces:
      - name: document_generate
        shape: "MCP tools{document.generate, form.prefill} → DOCX/PDF, versioned+checksummed, gaps surfaced (never silent blanks), QC-checked, stored"
        consumers: []
    consumes:
      - name: domain_model
        from: platform-foundation
      - name: docstore_port
        from: connector-framework
      - name: qc_verify
        from: qc-verification

  - id: document-routing
    title: Document routing — classify, name, file, permission (privilege-aware composition)
    type: integration
    status: implemented
    impl_note: >-
      Document classification, naming, ACL building, privilege-aware routing
      gate (restricted docs never to external recipients). Document classes
      and ACL map sourced from the active domain pack. 37 test functions.
      CI green.
    file: specs/document-routing/spec.md
    depends_on: [platform-foundation, connector-framework, qc-verification, data-extraction, domain-packs]
    produces:
      - name: document_route
        shape: "MCP tool{document.route} → classify, name, file, ACL; privilege-aware (privileged doc never routed to external recipient)"
        consumers: []
    consumes:
      - name: domain_model
        from: platform-foundation
      - name: docstore_port
        from: connector-framework
      - name: qc_verify
        from: qc-verification
      - name: document_extract
        from: data-extraction

  # ===== New features — post-Phase 2 additions =====

  - id: casemat-cli
    title: "casemat CLI — zero-friction local bootstrap + connector scaffold"
    type: unit
    status: planned
    spec_level: mini  # requirements + spec only
    file: specs/casemat-cli/spec.md
    depends_on: [platform-foundation, domain-packs, connector-framework]
    produces:
      - name: cli_tool
        shape: "casemat start | init --connector | status | stop"
        consumers: []
    consumes:
      - name: domain_pack
        from: domain-packs
      - name: case_port
        from: connector-framework
    impl_note: >-
      Developer-experience CLI. `casemat start` bootstraps Postgres + Redis +
      migrations + seed data + sidecar in one command. `casemat init --connector`
      scaffolds a new adapter. Mini-spec (requirements + spec only).

  - id: pack-inspector
    title: "Pack inspector — runtime-visible domain pack configuration"
    type: unit
    status: planned
    spec_level: mini  # requirements + spec only
    file: specs/pack-inspector/spec.md
    depends_on: [domain-packs]
    produces:
      - name: pack_inspect_endpoint
        shape: "GET /packs + GET /packs/{name}/inspect — resolved pack config (PII-redacted)"
        consumers: []
    consumes:
      - name: domain_pack
        from: domain-packs
    impl_note: >-
      Read-only HTTP endpoint exposing resolved pack configuration. PII patterns
      shown as counts only, never source strings. Makes the tighten-only
      restriction policy and PII floor observable at runtime. Mini-spec.

  - id: chaos-runner
    title: "Chaos/scenario runner — living NFR evidence"
    type: unit
    status: planned
    spec_level: full  # four-phase spec
    file: specs/chaos-runner/spec.md
    depends_on: [platform-foundation, workflow-orchestration, connector-framework, domain-packs]
    produces:
      - name: chaos_scenarios
        shape: "pytest tests/chaos/ — 6 named scenarios proving NFR-9, audit integrity, HMAC, idempotency"
        consumers: []
    consumes:
      - name: workflow_engine
        from: workflow-orchestration
      - name: webhook_events
        from: connector-framework
      - name: audit_log
        from: platform-foundation
      - name: domain_pack
        from: domain-packs
    impl_note: >-
      Full four-phase spec. 6 chaos scenarios: Postgres death mid-workflow,
      connector 500 retry, malformed webhook, Redis unavailable, pack
      validation refuse-to-serve, audit chain tamper. Each maps to a specific
      NFR. Requires live Postgres + Redis in CI.

  - id: replay-harness
    title: "Deterministic replay — record-and-replay for workflow debugging"
    type: unit
    status: planned
    spec_level: mini  # requirements + spec only
    file: specs/replay-harness/spec.md
    depends_on: [qc-verification, platform-foundation, domain-packs]
    produces:
      - name: replay_tool
        shape: "record(packet, outputs) -> JSON fixture; replay(fixture) -> byte-identical assertion"
        consumers: []
    consumes:
      - name: qc_verify
        from: qc-verification
      - name: audit_log
        from: platform-foundation
      - name: domain_pack
        from: domain-packs
    impl_note: >-
      Record-and-replay for QC/workflow debugging. Captures packet + outputs
      to JSON, re-runs and asserts byte-identical results via canonical JSON
      hash (ADR-1). pytest integration via --replay-dir. Mini-spec.

  - id: run-timeline
    title: "Run timeline / history view — durable state machine visualization"
    type: unit
    status: planned
    spec_level: mini  # requirements + spec only
    file: specs/run-timeline/spec.md
    depends_on: [workflow-orchestration]
    produces:
      - name: run_timeline_endpoint
        shape: "GET /runs + GET /runs/{id} — paginated run list + step timeline (Jinja2)"
        consumers: []
    consumes:
      - name: workflow_engine
        from: workflow-orchestration
    impl_note: >-
      Server-rendered web view of workflow runs and step progression. Proves
      gates persist across restarts, steps have timestamps, parked runs are
      visible. Jinja2 + minimal CSS, no SPA. Mini-spec.

# ---------------------------------------------------------------------------
# milestones — reporting/deployment groupings by architectural layer.
# Do NOT govern execution order (the DAG does). Layer names map loosely to the
# PRD §12 / PTD §17 phases noted in comments.
# ---------------------------------------------------------------------------
milestones:
  - name: foundations            # PRD Phase 0
    specs: [platform-foundation, domain-packs, connector-framework, workflow-orchestration]
    status: in_progress
    note: >-
      All 4 specs implemented. Phase 1 hardening: 1.5 (shim removal) ✅,
      1.2 (PostgresRunStore) ✅, 1.3 (SOPS+age secret store) ✅. Remaining:
      1.1 (vendor adapters — blocked on firm confirmation), 1.4 (PDF engine).
  - name: core-services          # engines consumed by workflows (PRD Wave 1–2)
    specs: [data-extraction, qc-verification, deadline-engine]
    status: implemented
    note: >-
      All 3 engines implemented with tests. QC restriction check + deadline
      rules read from the active domain pack.
  - name: workflows              # client-facing automations (PRD Wave 1–2)
    specs: [client-intake, status-update-emails, document-generation, document-routing]
    status: implemented
    note: >-
      All 4 workflows implemented with tests. Intake + routing config sourced
      from the active domain pack. PDF conversion stub remains (Phase 1.4).

  - name: tooling              # post-Phase 2 developer experience + credibility
    specs: [casemat-cli, pack-inspector, chaos-runner, replay-harness, run-timeline]
    status: not_started
    note: >-
      Five new features from PM/advisor assessment. Implementation order:
      casemat-cli (unblock forkers), pack-inspector (security model visible),
      chaos-runner (NFR evidence), run-timeline (durability visualization),
      replay-harness (debugging tooling).
