name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"  # Weekly nightly security scan — Monday 03:00 UTC

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  lint-and-type:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install deps
        run: uv sync --extra dev

      - name: ruff check
        run: uv run ruff check src/ tests/

      - name: mypy
        run: uv run mypy src/cam/

  # ─────────────────────────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install deps
        run: uv sync --extra dev

      - name: Bandit SAST (medium+ findings fail the build)
        run: |
          uv run bandit -r src/cam \
            --severity-level medium \
            --format json \
            --output bandit-report.json || (cat bandit-report.json && exit 1)

      - name: pip-audit dependency vulnerability check
        run: |
          uv run pip-audit \
            --format json \
            --output pip-audit-report.json || (cat pip-audit-report.json && exit 1)

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python }} / Postgres ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        pg: ["16"]

    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_DB: cam_test
          POSTGRES_USER: cam
          POSTGRES_PASSWORD: cam_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CAM_DATABASE_URL: postgresql+asyncpg://cam:cam_test_pw@localhost:5432/cam_test
      CAM_MIGRATION_URL: postgresql://cam:cam_test_pw@localhost:5432/cam_test
      CAM_REDIS_URL: redis://localhost:6379/0
      CAM_SECRET_BACKEND: env
      # Zero-filled test KEK — NEVER use in production
      CAM_ENCRYPTION_KEK: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install deps
        run: uv sync --extra dev

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Run tests with coverage (floor 70%)
        run: |
          uv run pytest \
            --cov=cam \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -q  # fail_under=75 is configured in pyproject.toml [tool.coverage.report]

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}-pg${{ matrix.pg }}
          path: coverage.xml
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  schema-drift:
    name: Schema drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install deps
        run: uv sync --extra dev

      - name: Check schema docs are in sync
        run: uv run python scripts/check_schema_drift.py
